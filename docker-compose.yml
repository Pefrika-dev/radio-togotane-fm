version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: radio-togotane-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: radio_togotane
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: radio-togotane-api
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/radio_togotane?schema=public"
      JWT_SECRET: "change-this-in-production"
      JWT_EXPIRES_IN: "7d"
      PORT: 4000
      NODE_ENV: "production"
      FRONTEND_URL: "http://localhost:5173"
      UPLOAD_DIR: "./uploads"
      MAX_FILE_SIZE: 5242880
      ADMIN_EMAIL: "admin@radiotogotane.co.ke"
      ADMIN_PASSWORD: "ChangeMe123!"
      ADMIN_NAME: "Station Administrator"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: radio-togotane-web
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
